[tool.ruff]
required-version = "==0.17.6"
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# starlette 0.45.3's TestClient (pinned to match the runtime) uses an alias anyio 4.16 deprecates.
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]
