name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: pytest (image)
        working-directory: image
        run: uv run --no-project --with-requirements requirements-dev.txt pytest -q
      - name: pytest (fake model)
        run: uv run --no-project --with pytest pytest -q tests/e2e/fake-model

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tools/go.mod
      - name: go test
        working-directory: tools
        run: go test ./... -race -count=1
