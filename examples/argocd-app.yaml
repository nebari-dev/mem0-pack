# Argo CD Application for mem0. Change the placeholders marked CHANGE.
# The chart renders the same bytes every time, so Argo CD sees no drift.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mem0
  namespace: argocd
spec:
  project: nebari-apps
  source:
    repoURL: https://nebari-dev.github.io/helm-repository
    chart: nebari-mem0
    targetRevision: 0.1.0-alpha.2   # CHANGE to the version you want
    helm:
      valuesObject:
        # The contents of examples/nebari-values.yaml, with the placeholders filled in.
        # No image tags: the published chart's release pins them to the release commit.
        # Tapas's ServiceAccount depends on its database.engine: javo-controller for sqlite (the
        # default, one pod), javo-gateway for postgres. The pod labels are the same for both.
        callers:
          - namespace: javo
            serviceAccount: javo-controller   # javo-gateway for postgres
            podSelector:
              app.kubernetes.io/name: javo
              app.kubernetes.io/component: gateway
        models:
          # llm-serving-pack's internal endpoint, with the /v1 prefix.
          baseURL: https://llm-internal.CHANGE.example.com/v1
          llm: CHANGE-chat-model
          embedding:
            model: CHANGE-embedding-model
            # The output width of the embedding model. Fixed at first install.
            dimensions: 1024
            # index: auto   # auto (default), hnsw or none. pgvector cannot build HNSW above 2000 dimensions;
            #                # auto switches to none (exact search) there. See the README.
          auth:
            # Keycloak token endpoint of the realm that holds the mem0 client.
            tokenURL: https://keycloak.CHANGE.example.com/realms/nebari/protocol/openid-connect/token
            # Secret in the release namespace with keys client-id and client-secret, created before install.
            existingSecret: mem0-model-client
    # Git source alternative, to run an unreleased commit. Replace the whole source block above
    # with this one. A checkout has no pinned image tags, so set both to images CI pushed for that commit.
    # repoURL: https://github.com/nebari-dev/mem0-pack
    # path: chart
    # targetRevision: main   # CHANGE to the commit the tags below were built from
    # helm:
    #   valuesObject:
    #     image:
    #       tag: sha-0123456789abcdef   # CHANGE
    #     tools:
    #       image:
    #         tag: sha-0123456789abcdef   # CHANGE
    #     callers:
    #       - namespace: javo
    #         serviceAccount: javo-controller   # javo-gateway for Tapas on postgres
    #         podSelector:
    #           app.kubernetes.io/name: javo
    #           app.kubernetes.io/component: gateway
    #     models:
    #       # llm-serving-pack's internal endpoint, with the /v1 prefix.
    #       baseURL: https://llm-internal.CHANGE.example.com/v1
    #       llm: CHANGE-chat-model
    #       embedding:
    #         model: CHANGE-embedding-model
    #         # The output width of the embedding model. Fixed at first install.
    #         dimensions: 1024
    #         # index: auto   # auto, hnsw or none; see the README
    #       auth:
    #         # Keycloak token endpoint of the realm that holds the mem0 client.
    #         tokenURL: https://keycloak.CHANGE.example.com/realms/nebari/protocol/openid-connect/token
    #         # Secret in the release namespace with keys client-id and client-secret, created before install.
    #         existingSecret: mem0-model-client
  destination:
    server: https://kubernetes.default.svc
    namespace: mem0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # No managedNamespaceMetadata: the chart has no NebariApp, so the namespace does not need the
    # nebari.dev/managed label.
